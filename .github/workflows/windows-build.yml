name: Build (Windows)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  win-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create launcher entry script
        shell: pwsh
        run: |
          @"
          import sqlalchemy
          import sqlalchemy.orm
          import sqlalchemy.ext.declarative

          from beirut_pos.app import main
          if __name__ == "__main__":
              main()
          "@ | Out-File -FilePath "launcher.py" -Encoding UTF8

      - name: Create PyInstaller hooks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "hooks" | Out-Null
          
          # CRITICAL: Hook for escpos to include capabilities.json
          @"
          from PyInstaller.utils.hooks import collect_all, collect_data_files
          datas, binaries, hiddenimports = collect_all('escpos')
          datas += collect_data_files('escpos')
          "@ | Out-File -FilePath "hooks/hook-escpos.py" -Encoding UTF8
          
          @"
          from PyInstaller.utils.hooks import collect_all
          datas, binaries, hiddenimports = collect_all('sqlalchemy')
          "@ | Out-File -FilePath "hooks/hook-sqlalchemy.py" -Encoding UTF8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6==6.5.2
          pip install SQLAlchemy==2.0.23
          pip install reportlab==4.0.7
          pip install pillow==10.0.1
          pip install qrcode==7.4.2
          pip install python-escpos==3.0
          pip install pyusb==1.2.1
          pip install pyserial==3.5
          pip install arabic-reshaper==3.0.0
          pip install python-bidi==0.4.2
          pip install pywin32==306
          pip install pdfkit==1.0.0
          pip install pyinstaller==5.13.2

      - name: Clean previous builds
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $args = @(
            'launcher.py',
            '--name','BeirutPOS',
            '--onefile',
            '--noconsole',
            '--clean',
            '--noconfirm',
            '--additional-hooks-dir','hooks',
            '--collect-all','PyQt6',
            '--collect-all','PyQt6.Qt6',
            '--collect-submodules','beirut_pos',
            '--collect-all','sqlalchemy',
            '--collect-all','escpos',
            '--collect-data','escpos',
            '--collect-submodules','arabic_reshaper',
            '--collect-submodules','bidi',
            '--hidden-import','sqlalchemy.dialects.sqlite',
            '--hidden-import','win32print',
            '--hidden-import','win32api',
            '--hidden-import','usb.core',
            '--hidden-import','usb.backend.libusb1',
            '--hidden-import','serial',
            '--hidden-import','PIL._imaging',
            '--hidden-import','pdfkit'
          )
          if (Test-Path 'assets/app.ico') { $args += @('--icon','assets/app.ico') }
          if (Test-Path 'assets') { $args += @('--add-data','assets;assets') }
          python -m PyInstaller @args

      - name: Test executable
        shell: pwsh
        run: |
          if (Test-Path "dist/BeirutPOS.exe") {
            echo "✅ EXE built: $((Get-Item 'dist/BeirutPOS.exe').Length / 1MB) MB"
          } else {
            echo "❌ EXE not found!"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeirutPOS-windows
          path: dist/BeirutPOS.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BeirutPOS.exe