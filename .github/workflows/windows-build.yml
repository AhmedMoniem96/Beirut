name: Build (Windows)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  win-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create launcher entry script
        shell: pwsh
        run: |
          @"
          import os

          # Force SQLAlchemy import so PyInstaller detects it
          import sqlalchemy
          import sqlalchemy.orm
          import sqlalchemy.ext.declarative

          # Build a single, working Windows app target.
          # Keep Jewelry as default mode for this executable.
          os.environ.setdefault("APP_MODE", "jewelry")

          from beirut_pos.app_launcher import run
          if __name__ == "__main__":
              run()
          "@ | Out-File -FilePath "launcher.py" -Encoding UTF8

      - name: Create PyInstaller hook for SQLAlchemy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "hooks" | Out-Null
          @"
          from PyInstaller.utils.hooks import collect_all
          datas, binaries, hiddenimports = collect_all('sqlalchemy')
          "@ | Out-File -FilePath "hooks/hook-sqlalchemy.py" -Encoding UTF8

      - name: Install dependencies (pinned)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip uninstall -y PyQt6 PyQt6-Qt6 PyQt6-sip 2>$null | Out-Null
          pip install --no-cache-dir --only-binary=:all: PyQt6==6.5.2
          pip install --no-cache-dir --only-binary=:all: PyQt6-Qt6==6.5.2
          pip install --no-cache-dir --only-binary=:all: "PyQt6-sip>=13.5,<14"

          # Core packages
          pip install --no-cache-dir SQLAlchemy==2.0.23
          pip install --no-cache-dir reportlab==4.0.7
          pip install --no-cache-dir pillow>=10.0.0
          pip install --no-cache-dir qrcode>=7.4
          pip install --no-cache-dir openpyxl>=3.1.2

          # ESC/POS printing stack
          pip install --no-cache-dir python-escpos==3.1.0
          pip install --no-cache-dir pyusb>=1.2.1
          pip install --no-cache-dir pyserial>=3.5

          # Arabic support
          pip install --no-cache-dir arabic-reshaper>=3.0.0
          pip install --no-cache-dir python-bidi>=0.4.2

          # Windows-specific printing backend
          pip install --no-cache-dir pywin32>=305

          # Builder
          pip install --no-cache-dir pyinstaller pyinstaller-hooks-contrib

      - name: Show versions (sanity check)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $code = @'
          from importlib.metadata import version as v
          from PyQt6.QtCore import QT_VERSION_STR as q
          import sys
          import sqlalchemy

          print("="*50)
          print("Dependency Versions:")
          print("="*50)
          print("PyQt6 =", v("PyQt6"), "| Qt6 =", q)
          print("SQLAlchemy =", sqlalchemy.__version__)

          checks = [
              ("python-escpos", "escpos"),
              ("pyusb", "usb"),
              ("pyserial", "serial"),
              ("arabic-reshaper", "arabic_reshaper"),
              ("python-bidi", "bidi"),
              ("openpyxl", "openpyxl"),
              ("pywin32", "win32api"),
          ]
          for dist, mod in checks:
              try:
                  __import__(mod)
                  print(f"{dist} ({mod}) =", v(dist))
              except Exception as e:
                  print(f"{dist} ({mod}) not importable:", e)

          print("="*50)
          '@
          Set-Content -Path show_versions.py -Value $code -Encoding UTF8
          python show_versions.py

      - name: Fetch libusb-1.0.dll (x64)
        shell: pwsh
        run: |
          $url = "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z"
          Invoke-WebRequest $url -OutFile libusb.7z
          7z x libusb.7z -olibusb | Out-Null
          $dll = Get-ChildItem -Recurse libusb -Filter "libusb-1.0.dll" | Where-Object { $_.FullName -match "MS64" } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Recurse libusb -Filter "libusb-1.0.dll" | Select-Object -First 1 }
          Copy-Item $dll.FullName libusb-1.0.dll

      - name: Set build env defaults
        shell: pwsh
        run: |
          echo "BEIRUT_POS_AR_FORCE_BITMAP=1" >> $env:GITHUB_ENV
          echo "BEIRUT_POS_TABLE_FONT=30" >> $env:GITHUB_ENV

      - name: Verify USB backend import
        shell: pwsh
        run: |
          $code = @'
          import os, usb.backend.libusb1
          print("libusb backend present:", usb.backend.libusb1.get_backend() is not None)
          print("DLL present:", os.path.exists("libusb-1.0.dll"))
          '@
          Set-Content -Path verify_usb.py -Value $code -Encoding UTF8
          python verify_usb.py

      - name: Clean previous build artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue

      - name: Ensure assets folders exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets')) { New-Item -ItemType Directory 'assets' | Out-Null }
          if (-not (Test-Path 'beirut_pos/assets/fonts')) {
            New-Item -ItemType Directory 'beirut_pos/assets/fonts' -Force | Out-Null
          }

      - name: Build EXE with canonical PyInstaller spec
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean BeirutPOS.spec

      - name: Inspect analysis warnings and archive contents
        shell: pwsh
        run: |
          $warnings = Get-Content build/BeirutPOS/warn-BeirutPOS.txt -Raw
          $unexpected = $warnings -split "`n" | Where-Object {
            $_ -match "missing module named (win32print|pywintypes)"
          }
          if ($unexpected) {
            $unexpected | Write-Error
            exit 1
          }
          pyi-archive_viewer -l dist/BeirutPOS.exe | Tee-Object -FilePath archive-contents.txt
          $archive = Get-Content archive-contents.txt -Raw
          foreach ($required in @('win32print', 'pywintypes')) {
            if ($archive -notmatch $required) { throw "$required is absent from the frozen archive" }
          }

      - name: Test built executable (smoke test)
        shell: pwsh
        run: |
          $exePath = "dist/BeirutPOS.exe"
          if (Test-Path $exePath) {
            $sizeMB = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
            Write-Host "EXE built successfully: $sizeMB MB"
            Write-Host "Location: $exePath"
            $process = Start-Process $exePath -ArgumentList '--frozen-smoke-test' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Frozen pywin32 smoke test failed: $($process.ExitCode)" }
            Write-Host "Frozen win32print/pywintypes smoke test passed"
          } else {
            Write-Host "ERROR: EXE not found at $exePath!"
            exit 1
          }

      - name: Calculate and display SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BeirutPOS.exe -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          echo "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeirutPOS-win-${{ github.run_number }}
          path: dist/BeirutPOS.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BeirutPOS.exe
          body: |
            ## BeirutPOS Windows Build

            **Features**
            - 80mm Thermal Printer Support (XP-80C compatible)
            - Arabic Text Support with Reshaping
            - USB/Serial Printer Communication
            - Enhanced Receipt & Bar Ticket Tables
            - SQLite Database
            - PyQt6 GUI

            **Installation**
            1. Download `BeirutPOS.exe`
            2. Install the official Windows driver for your thermal printer (e.g., XPrinter XP-80C) via the vendor installer or Windows Update.
            3. Run `BeirutPOS.exe` (Admin recommended for first USB access)

            **Notes**
            - WinUSB (Zadig) is ONLY needed if you choose the raw USB fallback. For normal Windows-driver printing, do NOT install WinUSB.
            - `libusb-1.0.dll` is bundled for the optional raw USB mode.

            **SHA256:** `${{ env.SHA256 }}`
          draft: false
          prerelease: false
          generate_release_notes: true
