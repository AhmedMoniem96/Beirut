name: Build (Windows)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  win-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create launcher entry script
        shell: pwsh
        run: |
          @"
          # Force SQLAlchemy import so PyInstaller detects it
          import sqlalchemy
          import sqlalchemy.orm
          import sqlalchemy.ext.declarative

          from beirut_pos.app import main
          if __name__ == "__main__":
              main()
          "@ | Out-File -FilePath "launcher.py" -Encoding UTF8

      - name: Create PyInstaller hook for SQLAlchemy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "hooks" | Out-Null
          @"
          from PyInstaller.utils.hooks import collect_all
          datas, binaries, hiddenimports = collect_all('sqlalchemy')
          "@ | Out-File -FilePath "hooks/hook-sqlalchemy.py" -Encoding UTF8

      - name: Install dependencies (pinned)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y PyQt6 PyQt6-Qt6 PyQt6-sip 2>$null | Out-Null
          pip install --no-cache-dir --only-binary=:all: PyQt6==6.5.2
          pip install --no-cache-dir --only-binary=:all: PyQt6-Qt6==6.5.2
          pip install --no-cache-dir --only-binary=:all: "PyQt6-sip>=13.5,<14"

          # Install core packages explicitly
          pip install --no-cache-dir SQLAlchemy==2.0.23
          pip install --no-cache-dir reportlab==4.0.7
          pip install --no-cache-dir pillow>=10.0.0
          pip install --no-cache-dir qrcode>=7.4
          
          # ESC/POS printing stack - CRITICAL for thermal printers
          pip install --no-cache-dir python-escpos>=3.0.0
          pip install --no-cache-dir pyusb>=1.2.1
          pip install --no-cache-dir pyserial>=3.5
          
          # Arabic support
          pip install --no-cache-dir arabic-reshaper>=3.0.0
          pip install --no-cache-dir python-bidi>=0.4.2
          
          # Windows-specific printing backend
          pip install --no-cache-dir pywin32>=305
          
          # Builder
          pip install --no-cache-dir pyinstaller pyinstaller-hooks-contrib

      - name: Show versions (sanity check)
        shell: pwsh
        run: |
          python -c "
          from importlib.metadata import version as v
          from PyQt6.QtCore import QT_VERSION_STR as q
          import sqlalchemy
          import escpos
          print('PyQt6 =', v('PyQt6'), '| Qt6 =', q)
          print('SQLAlchemy =', sqlalchemy.__version__)
          print('python-escpos =', v('python-escpos'))
          print('pyusb =', v('pyusb'))
          print('pyserial =', v('pyserial'))
          "

      - name: Clean previous build artifacts/spec
        shell: pwsh
        run: |
          if (Test-Path 'BeirutPOS.spec') { Remove-Item 'BeirutPOS.spec' -Force }
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue

      - name: Ensure assets folders exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets')) { New-Item -ItemType Directory 'assets' | Out-Null }
          if (-not (Test-Path 'beirut_pos/assets/fonts')) {
            New-Item -ItemType Directory 'beirut_pos/assets/fonts' -Force | Out-Null
          }

      - name: Build EXE with PyInstaller (bundle Qt + ESC/POS)
        shell: pwsh
        run: |
          $args = @(
            'launcher.py',
            '--name','BeirutPOS',
            '--onefile',
            '--noconsole',
            '--clean',
            '--additional-hooks-dir','hooks',
            '--collect-all','PyQt6',
            '--collect-all','PyQt6.Qt6',
            '--collect-submodules','beirut_pos',
            '--collect-all','sqlalchemy',
            '--hidden-import','sqlalchemy',
            '--hidden-import','sqlalchemy.ext.declarative',
            '--hidden-import','sqlalchemy.orm',
            '--hidden-import','sqlalchemy.sql',
            '--hidden-import','sqlalchemy.ext.baked',
            '--hidden-import','sqlalchemy.pool',
            '--hidden-import','sqlalchemy.dialects.sqlite',
            '--collect-all','sqlite3',
            '--collect-all','escpos',
            '--collect-submodules','arabic_reshaper',
            '--collect-submodules','bidi',
            '--hidden-import','PIL',
            '--hidden-import','PIL._imaging',
            '--hidden-import','PIL.Image',
            '--hidden-import','PIL.ImageFile',
            '--hidden-import','win32print',
            '--hidden-import','win32api',
            '--hidden-import','win32con',
            '--hidden-import','win32gui',
            '--hidden-import','win32ui',
            '--hidden-import','usb.core',
            '--hidden-import','usb.util',
            '--hidden-import','usb.backend',
            '--hidden-import','usb.backend.libusb1',
            '--hidden-import','serial',
            '--hidden-import','serial.tools',
            '--hidden-import','serial.tools.list_ports',
            '--hidden-import','escpos.printer',
            '--hidden-import','escpos.constants',
            '--hidden-import','escpos.exceptions',
            '--hidden-import','escpos.escpos',
            '--hidden-import','escpos.impl.epson',
            '--hidden-import','escpos.impl.generic',
            '--hidden-import','escpos.impl.legacy'
          )
          if (Test-Path 'assets/app.ico') { $args += @('--icon','assets/app.ico') }
          if (Test-Path 'assets') { $args += @('--add-data','assets;assets') }
          if (Test-Path 'beirut_pos/assets/fonts') {
            $args += @('--add-data','beirut_pos/assets/fonts;beirut_pos/assets/fonts')
          }
          python -m PyInstaller @args

      - name: Test built executable (quick smoke test)
        shell: pwsh
        run: |
          $exePath = "dist/BeirutPOS.exe"
          if (Test-Path $exePath) {
            echo "✅ EXE built successfully: $((Get-Item $exePath).Length / 1MB) MB"
            # Quick version check without GUI
            & $exePath --version 2>$null
            if ($LASTEXITCODE -ne 0) {
              echo "⚠️  Version check failed (normal if app doesn't support --version flag)"
            }
          } else {
            echo "❌ EXE not found!"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeirutPOS-win
          path: dist/BeirutPOS.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BeirutPOS.exe